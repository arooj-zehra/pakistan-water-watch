name: daily_ingest

# 05:00 UTC = 10:00 PKT, after WAPDA's morning release is out.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit raw snapshots back to the repo (audit trail)
  issues: write     # open an issue when a parser breaks

concurrency:
  group: daily_ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      # Settings > Secrets and variables > Actions. Without DATABASE_URL the job
      # runs against a throwaway SQLite file, which is only useful as a smoke test.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRESS_RELEASE_URL: ${{ vars.PRESS_RELEASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run daily pipeline
        id: run
        shell: bash  # explicit bash enables pipefail, so tee doesn't hide a failure
        run: python -m pipeline.daily 2>&1 | tee ingest.log

      # Only with the real database: a run without the secret uses an empty
      # throwaway SQLite file, and must not overwrite the website's data.
      - name: Export the website's data files
        if: always() && env.DATABASE_URL != ''
        run: python -m pipeline.export_static

      # Phase 5: queue suspicious values for review (web/public/data/review.json).
      - name: Check for suspicious values
        if: always() && env.DATABASE_URL != ''
        continue-on-error: true
        run: python -m pipeline.anomaly

      # Phase 4: forecasts. ERA5 runs ~5 days behind, so the newest days come
      # from Open-Meteo's forecast API (bias-corrected against ERA5 in models.data).
      - name: Update weather for the forecasts
        if: always() && env.DATABASE_URL != ''
        continue-on-error: true
        run: python -m pipeline.fetch_weather --update --recent

      # Issues forecasts (stored once, never changed), scores old ones, checks
      # for drift. Exit code 2 = monitor alert: handled by the issue step below.
      - name: Forecast, store and score
        id: forecast
        if: always() && env.DATABASE_URL != ''
        shell: bash
        run: |
          set +e
          python -m models.daily 2>&1 | tee forecast.log
          code=${PIPESTATUS[0]}
          if [ "$code" = "2" ]; then echo "alert=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code

      - name: Commit raw snapshots, weather, forecasts and website data
        if: always()
        run: |
          git config user.name "pww-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw || true
          git add data/inventory/news || true
          git add data/weather || true
          git add data/forecasts || true
          git add web/public/data || true
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || echo "nothing to push"

      - name: Open an issue on a model alert
        if: always() && steps.forecast.outputs.alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const mon = JSON.parse(fs.readFileSync('web/public/data/monitor.json', 'utf8'));
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'model-alert'
            });
            if (open.data.length) return;  // one open alert at a time; close it once handled
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Model alert ${new Date().toISOString().slice(0, 10)}`,
              labels: ['model-alert'],
              body: 'The daily forecast monitor raised an alert:\n\n' +
                    mon.alerts.map(a => `- ${a}`).join('\n') +
                    `\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
                    '\n\nCoverage or skill alerts mean the forecasts are going wrong: consider running the monthly ' +
                    'retrain now (Actions > monthly_retrain > Run workflow). Drift alerts mean conditions are unlike ' +
                    'any training year, so forecasts may be less reliable until the model has seen such a season. ' +
                    'Close this issue once handled; a new one opens only after that.'
            });

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '';
            const log = ((read('ingest.log') + '\n' + read('forecast.log')).trim() || '(no log)').slice(-6000);
            const title = `Daily ingest failed ${new Date().toISOString().slice(0, 10)}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'ingest-failure'
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              labels: ['ingest-failure'],
              body: `The daily pipeline failed. A source format may have changed.\n\n` +
                    `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    '```\n' + log + '\n```'
            });
