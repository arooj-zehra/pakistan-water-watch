# Render blueprint for the API (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint > pick this repo. Then set DATABASE_URL in the
# service's Environment tab (the same Neon string as in your .env).
services:
  - type: web
    name: pakistan-water-watch-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
